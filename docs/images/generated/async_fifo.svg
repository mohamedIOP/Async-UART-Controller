ght="60" rx="8" fill="#ffffff" stroke="#eb6834" stroke-width="1.5"/><text x="1107.5" y="140.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#0b0b0b" text-anchor="middle" font-weight="bold">R_INC</text><text x="1107.5" y="155.0" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal">from PULSE_GEN</text><path d="M 1045,140 L 1000,140" fill="none" stroke="#eb6834" stroke-width="1.8" marker-end="url(#ah1)" stroke-linejoin="round"/><rect x="860" y="400" width="310" height="80" rx="8" fill="#ffffff" stroke="#e34948" stroke-width="1.5"/><text x="1015.0" y="440.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#0b0b0b" text-anchor="middle" font-weight="bold">rempty  →  F_EMPTY</text><text x="1015.0" y="456.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#52514e" text-anchor="middle" font-weight="normal">rptr == rq2_wptr</text><rect x="485" y="430" width="230" height="70" rx="8" fill="#ebe8f7" stroke="#4a3aa7" stroke-width="2.5"/><text x="600.0" y="465.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#0b0b0b" text-anchor="middle" font-weight="bold">DF_SYNC × 2</text><text x="600.0" y="481.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#52514e" text-anchor="middle" font-weight="normal">2-flop synchronizer per pointer</text><path d="M 380,195 L 380,450 L 485,450" fill="none" stroke="#2a78d6" stroke-width="2" marker-end="url(#ah0)" stroke-linejoin="round"/><text x="388" y="300" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal">wptr_gray</text><path d="M 715,480 L 840,480 L 840,445 L 860,445" fill="none" stroke="#2a78d6" stroke-width="2" marker-end="url(#ah0)" stroke-linejoin="round"/><text x="790" y="497" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#52514e" text-anchor="middle" font-weight="normal">rq2_wptr</text><path d="M 820,195 L 820,450 