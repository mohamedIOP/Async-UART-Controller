<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" role="img"><title>Register file map</title><defs></defs><rect width="1100" height="560" fill="#ffffff"/><text x="20" y="30" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#0b0b0b" text-anchor="start" font-weight="bold">Register file — 16 × 8, address[3:0]</text><rect x="15" y="48" width="1070" height="30" rx="6" fill="#2a2a28" stroke="none" stroke-width="0"/><text x="28" y="68" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#ffffff" text-anchor="start" font-weight="bold">Address</text><text x="128" y="68" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#ffffff" text-anchor="start" font-weight="bold">Name</text><text x="238" y="68" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#ffffff" text-anchor="start" font-weight="bold">Reset</text><text x="338" y="68" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#ffffff" text-anchor="start" font-weight="bold">Purpose</text><rect x="15" y="84" width="1070" height="32" rx="4" fill="#fdf3d9" stroke="none" stroke-width="0"/><text x="28" y="105" font-family="Menlo, Consolas, monospace" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="bold">0x0</text><text x="128" y="105" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="bold">REG0</text><text x="238" y="105" font-family="Menlo, Consolas, monospace" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="normal">0x00</text><text x="338" y="105" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#52514e" text-anchor="start" font-weight="normal">ALU operand A</text><rect x="15" y="120" width="1070" height="32" rx="4" fill="#fdf3d9" stroke="none" stroke-width="0"/><text x="28" y="141" font-family="Menlo, Consolas, monospace" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="bold">0x1</text><text x="128" y="141" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="bold">REG1</text><text x="238" y="141" font-family="Menlo, Consolas, monospace" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="normal">0x00</text><text x="338" y="141" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#52514e" text-anchor="start" font-weight="normal">ALU operand B</text><rect x="15" y="156" width="1070" height="32" rx="4" fill="#ebe8f7" stroke="none" stroke-width="0"/><text x="28" y="177" font-family="Menlo, Consolas, monospace" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="bold">0x2</text><text x="128" y="177" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="bold">REG2</text><text x="238" y="177" font-family="Menlo, Consolas, monospace" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="normal">0x81</text><text x="338" y="177" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#52514e" text-anchor="start" font-weight="normal">UART configuration  (parity enable, parity type, prescale)</text><rect x="15" y="192" width="1070" height="32" rx="4" fill="#ebe8f7" stroke="none" stroke-width="0"/><text x="28" y="213" font-family="Menlo, Consolas, monospace" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="bold">0x3</text><text x="128" y="213" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="bold">REG3</text><text x="238" y="213" font-family="Menlo, Consolas, monospace" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="normal">0x20</text><text x="338" y="213" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#52514e" text-anchor="start" font-weight="normal">TX clock divider ratio  (÷32 → 115 200 baud)</text><rect x="15" y="228" width="1070" height="32" rx="4" fill="#e3f6ee" stroke="none" stroke-width="0"/><text x="28" y="249" font-family="Menlo, Consolas, monospace" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="bold">0x4 – 0xF</text><text x="128" y="249" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="bold">general purpose</text><text x="238" y="249" font-family="Menlo, Consolas, monospace" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="normal">0x00</text><text x="338" y="249" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#52514e" text-anchor="start" font-weight="normal">free storage (TB uses 0x5)</text><text x="20" y="318" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="bold">REG2 = 0x81 at reset</text><text x="199.0" y="336" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#8a8985" text-anchor="middle" font-weight="normal">bit 7</text><text x="317.0" y="336" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#8a8985" text-anchor="middle" font-weight="normal">bit 6</text><text x="435.0" y="336" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#8a8985" text-anchor="middle" font-weight="normal">bit 5</text><text x="553.0" y="336" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#8a8985" text-anchor="middle" font-weight="normal">bit 4</text><text x="671.0" y="336" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#8a8985" text-anchor="middle" font-weight="normal">bit 3</text><text x="789.0" y="336" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#8a8985" text-anchor="middle" font-weight="normal">bit 2</text><text x="907.0" y="336" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#8a8985" text-anchor="middle" font-weight="normal">bit 1</text><text x="1025.0" y="336" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#8a8985" text-anchor="middle" font-weight="normal">bit 0</text><rect x="140" y="342" width="704" height="62" rx="8" fill="#e8f1fc" stroke="#2a78d6" stroke-width="1.8"/><text x="492.0" y="370" font-family="Helvetica, Arial, sans-serif" font-size="13.5" fill="#0b0b0b" text-anchor="middle" font-weight="bold">prescale [7:2]</text><text x="492.0" y="390" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal">one-hot, default 100000 = 32 (RX oversampling)</text><rect x="848" y="342" width="114" height="62" rx="8" fill="#fdf3d9" stroke="#eda100" stroke-width="1.8"/><text x="905.0" y="370" font-family="Helvetica, Arial, sans-serif" font-size="13.5" fill="#0b0b0b" text-anchor="middle" font-weight="bold">parity type</text><text x="905.0" y="390" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal">0 even · 1 odd</text><rect x="966" y="342" width="114" height="62" rx="8" fill="#e3f6ee" stroke="#1baf7a" stroke-width="1.8"/><text x="1023.0" y="370" font-family="Helvetica, Arial, sans-serif" font-size="13.5" fill="#0b0b0b" text-anchor="middle" font-weight="bold">parity enable</text><text x="1023.0" y="390" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal">1 = parity on</text><text x="20" y="438" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="bold">REG3 = 0x20 at reset</text><text x="199.0" y="456" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#8a8985" text-anchor="middle" font-weight="normal">bit 7</text><text x="317.0" y="456" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#8a8985" text-anchor="middle" font-weight="normal">bit 6</text><text x="435.0" y="456" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#8a8985" text-anchor="middle" font-weight="normal">bit 5</text><text x="553.0" y="456" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#8a8985" text-anchor="middle" font-weight="normal">bit 4</text><text x="671.0" y="456" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#8a8985" text-anchor="middle" font-weight="normal">bit 3</text><text x="789.0" y="456" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#8a8985" text-anchor="middle" font-weight="normal">bit 2</text><text x="907.0" y="456" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#8a8985" text-anchor="middle" font-weight="normal">bit 1</text><text x="1025.0" y="456" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#8a8985" text-anchor="middle" font-weight="normal">bit 0</text><rect x="140" y="462" width="940" height="62" rx="8" fill="#e8f1fc" stroke="#2a78d6" stroke-width="1.8"/><text x="610.0" y="490" font-family="Helvetica, Arial, sans-serif" font-size="13.5" fill="#0b0b0b" text-anchor="middle" font-weight="bold">divider ratio [7:0]</text><text x="610.0" y="510" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal">TX_CLK = UART_CLK ÷ REG3  (0x20 = 32 → 115.2 kHz)</text></svg>