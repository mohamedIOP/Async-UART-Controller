<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img"><title>Clock generation, clock gating and reset synchronizers</title><defs><marker id="ah0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#eda100"/></marker><marker id="ah2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker><marker id="ah3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#eb6834"/></marker><marker id="ah4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a3aa7"/></marker><marker id="ah5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e34948"/></marker></defs><rect width="1200" height="700" fill="#ffffff"/><text x="20" y="30" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#0b0b0b" text-anchor="start" font-weight="bold">Clock tree</text><rect x="20" y="70" width="150" height="40" rx="20.0" fill="#e8f1fc" stroke="#2a78d6" stroke-width="1.5"/><text x="95.0" y="94.55" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="bold">REF_CLK  50 MHz</text><rect x="20" y="200" width="190" height="40" rx="20.0" fill="#fdeee7" stroke="#eb6834" stroke-width="1.5"/><text x="115.0" y="224.55" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="bold">UART_CLK  3.6864 MHz</text><rect x="300" y="62" width="150" height="56" rx="8" fill="#ffffff" stroke="#eda100" stroke-width="1.5"/><text x="375.0" y="90.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#0b0b0b" text-anchor="middle" font-weight="bold">CLK_GATE</text><text x="375.0" y="106.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#52514e" text-anchor="middle" font-weight="normal">latch + AND</text><path d="M 170,90 L 300,90" fill="none" stroke="#2a78d6" stroke-width="2" marker-end="url(#ah0)" stroke-linejoin="round"/><path d="M 450,90 L 560,90" fill="none" stroke="#eda100" stroke-width="2" marker-end="url(#ah1)" stroke-linejoin="round"/><rect x="560" y="70" width="120" height="40" rx="20.0" fill="#fdf3d9" stroke="#eda100" stroke-width="1.5"/><text x="620.0" y="94.55" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="bold">ALU_CLK</text><text x="690" y="95" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#52514e" text-anchor="start" font-weight="normal">→ ALU  (gated, runs only while an operation is active)</text><text x="375" y="140" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal">Gate_EN from SYS_CTRL</text><path d="M 375,150 L 375,118" fill="none" stroke="#52514e" stroke-width="1.8" marker-end="url(#ah2)" stroke-linejoin="round"/><path d="M 95,110 L 95,160 L 560,160" fill="none" stroke="#2a78d6" stroke-width="1.6" marker-end="url(#ah0)" stroke-linejoin="round"/><text x="570" y="165" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#52514e" text-anchor="start" font-weight="normal">→ SYS_CTRL, RegFile, ASYNC_FIFO (write side), DATA_SYNC (dest.)</text><text x="375" y="190" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#4a3aa7" text-anchor="middle" font-weight="bold">REG3 = 0x20  →  ÷ 32</text><rect x="300" y="200" width="150" height="56" rx="8" fill="#ffffff" stroke="#eb6834" stroke-width="1.5"/><text x="375.0" y="228.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#0b0b0b" text-anchor="middle" font-weight="bold">ClkDiv_TX</text><text x="375.0" y="244.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#52514e" text-anchor="middle" font-weight="normal">÷ REG3</text><rect x="300" y="305" width="150" height="56" rx="8" fill="#ffffff" stroke="#eb6834" stroke-width="1.5"/><text x="375.0" y="333.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#0b0b0b" text-anchor="middle" font-weight="bold">ClkDiv_RX</text><text x="375.0" y="349.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#52514e" text-anchor="middle" font-weight="normal">÷ ratio</text><path d="M 210,220 L 300,228" fill="none" stroke="#eb6834" stroke-width="2" marker-end="url(#ah3)" stroke-linejoin="round"/><path d="M 110,240 L 110,333 L 300,333" fill="none" stroke="#eb6834" stroke-width="2" marker-end="url(#ah3)" stroke-linejoin="round"/><path d="M 450,228 L 560,228" fill="none" stroke="#eb6834" stroke-width="2" marker-end="url(#ah3)" stroke-linejoin="round"/><path d="M 450,333 L 560,333" fill="none" stroke="#eb6834" stroke-width="2" marker-end="url(#ah3)" stroke-linejoin="round"/><rect x="560" y="208" width="120" height="40" rx="20.0" fill="#fdeee7" stroke="#eb6834" stroke-width="1.5"/><text x="620.0" y="232.55" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="bold">TX_CLK</text><rect x="560" y="313" width="120" height="40" rx="20.0" fill="#fdeee7" stroke="#eb6834" stroke-width="1.5"/><text x="620.0" y="337.55" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="bold">RX_CLK</text><text x="690" y="233" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#52514e" text-anchor="start" font-weight="normal">→ UART_TX, ASYNC_FIFO (read side), PULSE_GEN   (÷32 = 115.2 kHz)</text><text x="690" y="338" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#52514e" text-anchor="start" font-weight="normal">→ UART_RX   (÷1 at prescale 32 = 3.6864 MHz, i.e. 32× oversampling)</text><rect x="290" y="410" width="170" height="56" rx="8" fill="#ebe8f7" stroke="#4a3aa7" stroke-width="1.5"/><text x="375.0" y="438.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#0b0b0b" text-anchor="middle" font-weight="bold">CLKDIV_MUX</text><text x="375.0" y="453.0" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal">one-hot → ratio</text><path d="M 375,410 L 375,361" fill="none" stroke="#4a3aa7" stroke-width="1.8" marker-end="url(#ah4)" stroke-linejoin="round"/><text x="385" y="392" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal">ratio</text><text x="20" y="443" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#4a3aa7" text-anchor="start" font-weight="bold">REG2[7:2] prescale</text><path d="M 165,438 L 290,438" fill="none" stroke="#4a3aa7" stroke-width="1.8" marker-end="url(#ah4)" stroke-linejoin="round"/><text x="480" y="443" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal">100000 → 1     010000 → 2     001000 → 4     000100 → 8     other → 1</text><rect x="15" y="500" width="1170" height="185" rx="12" fill="#f2f2f0" stroke="#c9c8c3" stroke-width="1"/><text x="30" y="527" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#0b0b0b" text-anchor="start" font-weight="bold">Reset network:  asynchronous assert, synchronous de-assert (one synchronizer per domain)</text><rect x="35" y="565" width="110" height="40" rx="20.0" fill="#ffffff" stroke="#e34948" stroke-width="1.5"/><text x="90.0" y="589.55" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="bold">RST (async)</text><path d="M 145,585 L 200,585 L 200,570 L 300,570" fill="none" stroke="#e34948" stroke-width="1.5" marker-end="url(#ah5)" stroke-linejoin="round"/><rect x="300" y="548" width="70" height="44" rx="8" fill="#ffffff" stroke="#2a78d6" stroke-width="1.5"/><text x="335.0" y="570.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="bold">FF</text><text x="335.0" y="584.0" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#52514e" text-anchor="middle" font-weight="normal">D = 1</text><rect x="430" y="548" width="70" height="44" rx="8" fill="#ffffff" stroke="#2a78d6" stroke-width="1.5"/><text x="465.0" y="574.55" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="bold">FF</text><path d="M 370,570 L 430,570" fill="none" stroke="#2a78d6" stroke-width="1.8" marker-end="url(#ah0)" stroke-linejoin="round"/><path d="M 500,570 L 630,570" fill="none" stroke="#2a78d6" stroke-width="2" marker-end="url(#ah0)" stroke-linejoin="round"/><text x="400" y="544" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal">RST_SYNC_1  (REF_CLK)</text><text x="640" y="575" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#52514e" text-anchor="start" font-weight="normal">SYNC_RST → REF-domain flops</text><path d="M 145,585 L 200,585 L 200,632 L 300,632" fill="none" stroke="#e34948" stroke-width="1.5" marker-end="url(#ah5)" stroke-linejoin="round"/><rect x="300" y="610" width="70" height="44" rx="8" fill="#ffffff" stroke="#eb6834" stroke-width="1.5"/><text x="335.0" y="632.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="bold">FF</text><text x="335.0" y="646.0" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#52514e" text-anchor="middle" font-weight="normal">D = 1</text><rect x="430" y="610" width="70" height="44" rx="8" fill="#ffffff" stroke="#eb6834" stroke-width="1.5"/><text x="465.0" y="636.55" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="bold">FF</text><path d="M 370,632 L 430,632" fill="none" stroke="#eb6834" stroke-width="1.8" marker-end="url(#ah3)" stroke-linejoin="round"/><path d="M 500,632 L 630,632" fill="none" stroke="#eb6834" stroke-width="2" marker-end="url(#ah3)" stroke-linejoin="round"/><text x="400" y="606" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal">RST_SYNC_2  (UART_CLK)</text><text x="640" y="637" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#52514e" text-anchor="start" font-weight="normal">SYNC_RST → UART-domain flops</text><text x="1000" y="592" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#52514e" text-anchor="middle" font-weight="normal" font-style="italic">RST low resets both domains at once;</text><text x="1000" y="607" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#52514e" text-anchor="middle" font-weight="normal" font-style="italic">release is aligned to each domain's own clock</text><text x="1000" y="622" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#52514e" text-anchor="middle" font-weight="normal" font-style="italic">(≈ 0.54 µs in the UART domain)</text></svg>