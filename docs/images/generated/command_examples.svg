anchor="middle" font-weight="bold">00</text><text x="715.0" y="338" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#52514e" text-anchor="middle" font-weight="normal">MSB</text><text x="1175" y="306" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#0b0b0b" text-anchor="end" font-weight="bold">0x20 + 0x05 = 0x0025</text><rect x="15" y="372" width="1170" height="92" rx="8" fill="#ffffff" stroke="none" stroke-width="0"/><text x="25" y="404" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#0b0b0b" text-anchor="start" font-weight="bold">0xDD</text><text x="25" y="424" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal">ALU, stored A/B</text><text x="25" y="442" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#8a8985" text-anchor="start" font-weight="normal" font-style="italic">TC4</text><rect x="235" y="380" width="70" height="40" rx="8" fill="#ebe8f7" stroke="#4a3aa7" stroke-width="1.8"/><text x="270.0" y="406" font-family="Menlo, Consolas, monospace" font-size="17" fill="#0b0b0b" text-anchor="middle" font-weight="bold">DD</text><text x="270.0" y="438" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#52514e" text-anchor="middle" font-weight="normal">opcode</text><rect x="313" y="380" width="70" height="40" rx="8" fill="#e8f1fc" stroke="#2a78d6" stroke-width="1.8"/><text x="348.0" y="406" font-family="Menlo, Consolas, monospace" font-size="17" fill="#0b0b0b" text-anchor="middle" font-weight="bold">01</text><text x="348.0" y="438" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#52514e" text-anchor="middle" font-weight="normal">ALU_FUN = SUB</text><path d="M 391,400 L 594,400" fill="none" stroke="#8a8985" stroke-width="1.4" stroke-dasharray="3 3" marker-end="url(#ah0)" stroke-linejoin="round"/><rect x="602" y="380" width="70" height="40" rx="8" fill="#fdeee7" stroke="#eb6834" stroke-width="1.8"/><text x="637.0" y="406" font-family="Menlo, Consolas, monospace" font-size="17" fill="#0b0b0b" text-anchor="middle" font-weight="bold">1B</text><text x="637.0" y="438" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#52514e" text-anchor="middle" font-weight="normal">LSB</text><rect x="680" y="380" width="70" height="40" rx="8" fill="#fdeee7" stroke="#eb6834" stroke-width="1.8"/><text x="715.0" y="406" font-family="Menlo, Consolas, monospace" font-size="17" fill="#0b0b0b" text-anchor="middle" font-weight="bold">00</text><text x="715.0" y="438" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#52514e" text-anchor="middle" font-weight="normal">MSB</text><text x="1175" y="406" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#0b0b0b" text-anchor="end" font-weight="bold">0x20 − 0x05 = 0x001B</text><rect x="15" y="472" width="1170" height="92" rx="8" fill="#f2f2f0" stroke="none" stroke-width="0"/><text x="25" y="504" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#0b0b0b" text-anchor="start" font-weight="bold">0xCC</text><text x="25" y="524" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal">ALU + operands</text><text x="25" y="542" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#8a8985" text-anchor="start" font-weight="normal" font-style="italic">TC5</text><rect x="235" y="480" width="70" height="40" rx="8" fill="#ebe8f7" stroke="#4a3aa7" stroke-width="1.8"/><text x="270.0" y="506" font-family="Menlo, Consolas, monospace" font-size="17" fill="#0b0b0b" text-anchor="middle" font-weight="bold">CC</text><text x="270.0" y="538" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#52514e" text-anchor="middle" font-weight="normal">opcode</text><rect x="313" y="480" width="70" height="40" rx="8" fill="#e8f1fc" stroke="#2a78d6" stroke-width="1.8"/><text x="348.0" y="506" font-family="Menlo, Consolas, monospace" font-size="17" fill="#0b0b0b" text-anchor="middle" font-weight="bold">12</text><text x="348.0" y="538" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#52514e" text-anchor="middle" font-weight="normal">A</text><rect x="391" y="480" width="70" height="40" rx="8" fill="#e8f1fc" stroke="#2a78d6" stroke-width="1.8"/><text x="426.0" y="506" font-family="Menlo, Consolas, monospace" font-size="17" fill="#0b0b0b" text-anchor="middle" font-weight="bold">10</text><text x="426.0" y="538" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#52514e" text-anchor="middle" font-weight="normal">B</text><rect x="469" y="480" width="70" height="40" rx="8" fill="#e8f1fc" stroke="#2a78d6" stroke-width="1.8"/><text x="504.0" y="506" font-family="Menlo, Consolas, monospace" font-size="17" fill="#0b0b0b" text-anchor="middle" font-weight="bold">02</text><text x="504.0" y="538" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#52514e" text-anchor="middle" font-weight="normal">ALU_FUN = MUL</text><path d="M 547,500 L 594,500" fill="none" stroke="#8a8985" stroke-width="1.4" stroke-dasharray="3 3" marker-end="url(#ah0)" stroke-linejoin="round"/><rect x="602" y="480" width="70" height="40" rx="8" fill="#fdeee7" stroke="#eb6834" stroke-width="1.8"/><text x="637.0" y="506" font-family="Menlo, Consolas, monospace" font-size="17" fill="#0b0b0b" text-anchor="middle" font-weight="bold">20</text><text x="637.0" y="538" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#52514e" text-anchor="middle" font-weight="normal">LSB</text><rect x="680" y="480" width="70" height="40" rx="8" fill="#fdeee7" stroke="#eb6834" stroke-width="1.8"/><text x="715.0" y="506" font-family="Menlo, Consolas, monospace" font-size="17" fill="#0b0b0b" text-anchor="middle" font-weight="bold">01</text><text x="715.0" y="538" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#52514e" text-anchor="middle" font-weight="normal">MSB</text><text x="1175" y="506" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#0b0b0b" text-anchor="end" font-weight="bold">0x12 × 0x10 = 0x0120</text><text x="20" y="592" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#52514e" text-anchor="start" font-weight="normal" font-style="italic">Opcode frame first; ALU results always return LSB first. 0xDD reuses the REG0 / REG1 left behind by the previous 0xCC (TC3 → TC4).</text></svg>