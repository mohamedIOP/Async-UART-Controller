<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img"><title>Example transactions on RX_IN and TX_OUT</title><defs><marker id="ah0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a8985"/></marker></defs><rect width="1200" height="600" fill="#ffffff"/><text x="20" y="30" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#0b0b0b" text-anchor="start" font-weight="bold">What goes in and what comes out  (each box = one 11-bit UART frame)</text><text x="235" y="62" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#2a78d6" text-anchor="start" font-weight="bold">RX_IN   (host → chip)</text><text x="602" y="62" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#eb6834" text-anchor="start" font-weight="bold">TX_OUT   (chip → host)</text><rect x="15" y="72" width="1170" height="92" rx="8" fill="#f2f2f0" stroke="none" stroke-width="0"/><text x="25" y="104" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#0b0b0b" text-anchor="start" font-weight="bold">0xAA</text><text x="25" y="124" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal">RF write</text><text x="25" y="142" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#8a8985" text-anchor="start" font-weight="normal" font-style="italic">TC1</text><rect x="235" y="80" width="70" height="40" rx="8" fill="#ebe8f7" stroke="#4a3aa7" stroke-width="1.8"/><text x="270.0" y="106" font-family="Menlo, Consolas, monospace" font-size="17" fill="#0b0b0b" text-anchor="middle" font-weight="bold">AA</text><text x="270.0" y="138" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#52514e" text-anchor="middle" font-weight="normal">opcode</text><rect x="313" y="80" width="70" height="40" rx="8" fill="#e8f1fc" stroke="#2a78d6" stroke-width="1.8"/><text x="348.0" y="