"/><text x="471.0" y="432" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#0b0b0b" text-anchor="middle" font-weight="normal">12</text><rect x="489" y="410" width="30" height="34" rx="4" fill="#ffffff" stroke="#52514e" stroke-width="1.4"/><text x="504.0" y="432" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#0b0b0b" text-anchor="middle" font-weight="normal">13</text><rect x="522" y="410" width="30" height="34" rx="4" fill="#ffffff" stroke="#52514e" stroke-width="1.4"/><text x="537.0" y="432" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#0b0b0b" text-anchor="middle" font-weight="normal">14</text><rect x="555" y="410" width="30" height="34" rx="4" fill="#2a78d6" stroke="#2a78d6" stroke-width="1.4"/><text x="570.0" y="432" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">15</text><rect x="588" y="410" width="30" height="34" rx="4" fill="#2a78d6" stroke="#2a78d6" stroke-width="1.4"/><text x="603.0" y="432" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">16</text><rect x="621" y="410" width="30" height="34" rx="4" fill="#2a78d6" stroke="#2a78d6" stroke-width="1.4"/><text x="636.0" y="432" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">17</text><rect x="654" y="410" width="30" height="34" rx="4" fill="#eda100" stroke="#eda100" stroke-width="1.4"/><text x="669.0" y="432" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#0b0b0b" text-anchor="middle" font-weight="bold">18</text><rect x="687" y="410" width="30" height="34" rx="4" fill="#ffffff" stroke="#52514e" stroke-width="1.4"/><text x="702.0" y="432" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#0b0b0b" text-anchor="middle" font-weight="normal">19</text><rect x="720" y="410" width="30" height="34" rx="4" fill="#ffffff" stroke="#52514e" stroke-width="1.4"/><text x="735.0" y="432" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#0b0b0b" text-anchor="middle" font-weight="normal">20</text><rect x="753" y="410" width="30" height="34" rx="4" fill="#ffffff" stroke="#52514e" stroke-width="1.4"/><text x="768.0" y="432" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#0b0b0b" text-anchor="middle" font-weight="normal">21</text><rect x="786" y="410" width="30" height="34" rx="4" fill="#ffffff" stroke="#52514e" stroke-width="1.4"/><text x="801.0" y="432" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#0b0b0b" text-anchor="middle" font-weight="normal">22</text><rect x="819" y="410" width="30" height="34" rx="4" fill="#ffffff" stroke="#52514e" stroke-width="1.4"/><text x="834.0" y="432" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#0b0b0b" text-anchor="middle" font-weight="normal">23</text><rect x="852" y="410" width="30" height="34" rx="4" fill="#ffffff" stroke="#52514e" stroke-width="1.4"/><text x="867.0" y="432" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#0b0b0b" text-anchor="middle" font-weight="normal">24</text><rect x="885" y="410" width="30" height="34" rx="4" fill="#ffffff" stroke="#52514e" stroke-width="1.4"/><text x="900.0" y="432" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#0b0b0b" text-anchor="middle" font-weight="normal">25</text><rect x="918" y="410" width="30" height="34" rx="4" fill="#ffffff" stroke="#52514e" stroke-width="1.4"/><text x="933.0" y="432" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#0b0b0b" text-anchor="middle" font-weight="normal">26</text><rect x="951" y="410" width="30" height="34" rx="4" fill="#ffffff" stroke="#52514e" stroke-width="1.4"/><text x="966.0" y="432" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#0b0b0b" text-anchor="middle" font-weight="normal">27</text><rect x="984" y="410" width="30" height="34" rx="4" fill="#ffffff" stroke="#52514e" stroke-width="1.4"/><text x="999.0" y="432" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#0b0b0b" text-anchor="middle" font-weight="normal">28</text><rect x="1017" y="410" width="30" height="34" rx="4" fill="#ffffff" stroke="#52514e" stroke-width="1.4"/><text x="1032.0" y="432" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#0b0b0b" text-anchor="middle" font-weight="normal">29</text><rect x="1050" y="410" width="30" height="34" rx="4" fill="#ffffff" stroke="#52514e" stroke-width="1.4"/><text x="1065.0" y="432" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#0b0b0b" text-anchor="middle" font-weight="normal">30</text><rect x="1083" y="410" width="30" height="34" rx="4" fill="#fdeee7" stroke="#eb6834" stroke-width="1.4"/><text x="1098.0" y="432" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#0b0b0b" text-anchor="middle" font-weight="bold">31</text><text x="60" y="398" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#52514e" text-anchor="start" font-weight="normal">edge_cnt  →</text><path d="M 555,450 L 651,450" fill="none" stroke="#2a78d6" stroke-width="2.2" stroke-linejoin="round"/><path d="M 603.0,450 L 603.0,472" fill="none" stroke="#2a78d6" stroke-width="1.5" stroke-linejoin="round"/><text x="603.0" y="488" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#2a78d6" text-anchor="middle" font-weight="bold">edges 15, 16, 17  (middle−1, middle, middle+1)</text><text x="603.0" y="504" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#52514e" text-anchor="middle" font-weight="normal">dat_samp_en high: three RX_IN samples go into majority_reg</text><path d="M 669.0,448 L 669.0,472 L 844.0,472" fill="none" stroke="#eda100" stroke-width="1.5" stroke-linejoin="round"/><text x="851.0" y="476" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#9a6a00" text-anchor="start" font-weight="bold">edge 18  (middle+2)</text><text x="851.0" y="492" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#52514e" text-anchor="start" font-weight="normal">sampled_bit = majority; start / parity / stop checks fire</text><path d="M 1098.0,406 L 1098.0,382 L 1028.0,382" fill="none" stroke="#eb6834" stroke-width="1.5" stroke-linejoin="round"/><text x="1022.0" y="386" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#b3441a" text-anchor="end" font-weight="bold">edge 31 = prescale−1: next bit (bit_cnt + 1)</text><text x="60" y="342" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#52514e" text-anchor="start" font-weight="normal">RX_CLK = UART_CLK ÷ 1 = 3.6864 MHz  →  32 edges per bit at 115 200 baud</text><text x="60" y="360" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal">A start-bit glitch (start check fails) returns the FSM to idle; data_valid is raised in the stop state when no parity / stop error was seen.</text></svg>