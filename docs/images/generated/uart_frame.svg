<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img"><title>UART frame and receiver sampling</title><defs><marker id="ah0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a3aa7"/></marker><marker id="ah0s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#4a3aa7"/></marker></defs><rect width="1200" height="560" fill="#ffffff"/><text x="20" y="28" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#0b0b0b" text-anchor="start" font-weight="bold">Frame for 0x55 with even parity  (data sent LSB first, 11 bit-times)</text><rect x="120" y="62" width="80" height="130" rx="0" fill="#fdeee7" stroke="none" stroke-width="0" opacity="0.9"/><rect x="200" y="62" width="80" height="130" rx="0" fill="#e8f1fc" stroke="none" stroke-width="0" opacity="0.9"/><rect x="280" y="62" width="80" height="130" rx="0" fill="#e8f1fc" stroke="none" stroke-width="0" opacity="0.9"/><rect x="360" y="62" width="80" height="130" rx="0" fill="#e8f1fc" stroke="none" stroke-width="0" opacity="0.9"/><rect x="440" y="62" width="80" height="130" rx="0" fill="#e8f1fc" stroke="none" stroke-width="0" opacity="0.9"/><rect x="520" y="62" width="80" height="130" rx="0" fill="#e8f1fc" stroke="none" stroke-width="0" opacity="0.9"/><rect x="600" y="62" width="80" height="130" rx="0" fill="#e8f1fc" stroke="none" stroke-width="0" opacity="0.9"/><rect x="680" y="62" width="80" height="130" rx="0" fill="#e8f1fc" stroke="none" stroke-width="0" opacity="0.9"/><rect x="760" y="62" width="80" height="130" rx="0" fill="#e8f1fc" stroke="none" stroke-width="0" opacity="0.9"/><rect x="840" y="62" width="80" height="130" rx="0" fill="#fdf3d9" stroke="none" stroke-width="0" opacity="0.9"/><rect x="920" y="62" width="80" height="130" rx="0" fill="#e3f6ee" stroke="none" stroke-width="0" opacity="0.9"/><path d="M 120