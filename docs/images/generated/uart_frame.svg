xt><text x="720.0" y="213" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#52514e" text-anchor="middle" font-weight="normal">1</text><text x="800.0" y="56" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#0b0b0b" text-anchor="middle" font-weight="bold">D7</text><text x="800.0" y="213" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#52514e" text-anchor="middle" font-weight="normal">0</text><text x="880.0" y="56" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#0b0b0b" text-anchor="middle" font-weight="bold">PAR</text><text x="880.0" y="213" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#52514e" text-anchor="middle" font-weight="normal">0</text><text x="960.0" y="56" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#0b0b0b" text-anchor="middle" font-weight="bold">STOP</text><text x="960.0" y="213" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#52514e" text-anchor="middle" font-weight="normal">1</text><text x="30" y="94" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal">1</text><text x="30" y="154" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal">0</text><text x="40" y="82" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal">idle</text><text x="1008" y="82" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal">idle</text><path d="M 200,235 L 840,235" fill="none" stroke="#4a3aa7" stroke-width="1.8" marker-end="url(#ah0)" marker-start="url(#ah0s)" stroke-linejoin="round"/><text x="520" y="254" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#4a3aa7" text-anchor="middle" font-weight="bold">8 data bits, LSB first   (0x55 = 0101 0101  →  1 0 1 0 1 0 1 0 on the wire)</text><text x="860" y="232" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal">REG2[0] = 1: parity bit present</text><text x="860" y="248" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal">REG2[1] = 0: even  (PAR = ^data)</text><text x="1168" y="213" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#52514e" text-anchor="end" font-weight="normal" font-style="italic">1 bit = 8.68 µs @ 115 200 baud</text><rect x="15" y="290" width="1170" height="255" rx="12" fill="#f2f2f0" stroke="#c9c8c3" stroke-width="1"/><text x="30" y="316" font-family="Helvetica, Arial, sans-serif" font-size="14.5" fill="#0b0b0b" text-anchor="start" font-weight="bold">Inside one bit: the receiver counts 32 RX_CLK edges (prescale = 32) and takes a 3-sample majority around the middle</text><rect x="60" y="410" width="30" height="34" rx="4" fill="#ffffff" stroke="#52514e" stroke-width="1.4"/><text x="75.0" y="432" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#0b0b0b" text-anchor="middle" font-weight="normal">0</text><rect x="93" y="410" width="30" height="34" rx="4" fill="#ffffff" stroke="#52514e" stroke-width="1.4"/><text x="108.0" y="432" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#0b0b0b" text-anchor="middle" font-weight="normal">1</text><rect x="126" y="410" width="30" height="34" rx="4" fill="#ffffff" stroke="#52514e" stroke-width="1.4"/><text x="141.0" y="432" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#0b0b0b" text-anchor="middle" font-weight="normal">2</text><rect x="159" y="410" width="30" height="34" rx="4" fill="#ffffff" stroke="#52514e" stroke-width="1.4"/><text x="174.0" y="432" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#0b0b0b" text-anchor="middle" font-weight="normal">3</text><rect x="192" y="410" width="30" height="34" rx="4" fill="#ffffff" stroke="#52514e" stroke-width="1.4"/><text x